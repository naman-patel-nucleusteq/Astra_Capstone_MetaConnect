databaseChangeLog:
   - changeSet:
       id: 008-create-ingestion-runs
       author: metaconnect
       changes:
          - createTable:
              tableName: ingestion_runs
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false              
              
                - column:
                    name: service_id
                    type: BIGINT
                    constraints:
                      nullable: false
                           
                - column:
                    name: status
                    type: VARCHAR(20)
                    constraints:
                      nullable: false
                           
                - column:
                    name: started_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false
                           
                - column:
                    name: finished_at
                    type: TIMESTAMP
              
              
          - addForeignKeyConstraint:
                baseTableName: ingestion_runs
                baseColumnNames: service_id
                referencedTableName: services
                referencedColumnNames: id
                constraintName: fk_ingestion_runs_service