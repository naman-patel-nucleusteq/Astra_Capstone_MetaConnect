databaseChangeLog:
  - changeSet:
      id: 003-create-schemas
      author: metaconnect
      changes:
        - createTable:
            tableName: schemas
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                       
              - column:
                  name: database_id
                  type: BIGINT
                  constraints:
                    nullable: false           
            
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
               
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
            
              - addForeignKeyConstraint:
                  baseTableName: schemas
                  baseColumnNames: database_id
                  referencedTableName: databases
                  referencedColumnNames: id
                  constraintName: fk_schemas_database