databaseChangeLog:
  - changeSet:
      id: 017-create-metadata-staging
      author: metaconnect
      changes:
        - createTable:
            tableName: metadata_staging
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: ingestion_run_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: entity_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: database_name
                  type: VARCHAR(200)

              - column:
                  name: schema_name
                  type: VARCHAR(200)

              - column:
                  name: table_name
                  type: VARCHAR(200)

              - column:
                  name: column_name
                  type: VARCHAR(200)

              - column:
                  name: metadata_json
                  type: JSONB

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: metadata_staging
            baseColumnNames: ingestion_run_id
            referencedTableName: ingestion_runs
            referencedColumnNames: id
            constraintName: fk_metadata_staging_ingestion_run

        - createIndex:
            indexName: idx_metadata_staging_run_entity
            tableName: metadata_staging
            columns:
              - column:
                  name: ingestion_run_id
              - column:
                  name: entity_type
