databaseChangeLog:
  - changeSet:
      id: 004-create-tables
      author: metaconnect
      changes:
        - createTable:
            tableName: tables
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
            
              - column:
                  name: schema_id
                  type: BIGINT
                  constraints:
                    nullable: false
                       
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                        
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                       
              - addForeignKeyConstraint:
                  baseTableName: tables
                  baseColumnNames: schema_id
                  referencedTableName: schemas
                  referencedColumnNames: id
                  constraintName: fk_tables_schema