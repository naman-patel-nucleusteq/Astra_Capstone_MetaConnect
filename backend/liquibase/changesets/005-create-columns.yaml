databaseChangeLog:
  - changeSet:
      id: 005-create-columns
      author: metaconnect
      changes:
        - createTable:
            tableName: columns
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false           
            
              - column:
                  name: table_id
                  type: BIGINT
                  constraints:
                    nullable: false
                       
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                        
              - column:
                  name: data_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                        
              - column:
                  name: is_nullable
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                        
              - column:
                  name: ordinal_position
                  type: INTEGER
                  constraints:
                    nullable: false
                        
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                       
              - addForeignKeyConstraint:
                  baseTableName: columns
                  baseColumnNames: table_id
                  referencedTableName: tables
                  referencedColumnNames: id
                  constraintName: fk_columns_table